<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}} - bazarish</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body data-copy-do="{{t.copy.do}}" data-copy-done="{{t.copy.done}}"
  data-copy-byhand="{{t.copy.byhand}}">
<div class="screen">
  <header class="masthead">
    <div class="masthead-row">
      <h1 class="masthead-title brand"><img class="wordmark" src="logo.svg" alt="bazarish"
        width="404" height="76"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><circle cx="5.6" cy="10.6" r="2.4"/><path d="M1.2 22v-1.2a4.4 4.4 0 0 1 6.4-3.9"/><circle cx="22.4" cy="10.6" r="2.4"/><path d="M26.8 22v-1.2a4.4 4.4 0 0 0-6.4-3.9"/><circle cx="14" cy="8.6" r="3.6"/><path d="M7.4 25v-2a6.6 6.6 0 0 1 13.2 0v2"/></svg></h1>
{{switch}}
    </div>
    <p class="masthead-note">{{strapline}}</p>
  </header>
{{session}}
  <main class="view">
{{content}}
  </main>
  <footer class="colophon"><span>{{t.page.colophon}}</span>
    <span><a href="https://bazarish.org">bazarish.org</a> &middot; <a href="http://bazarish.i2p">bazarish.i2p</a></span></footer>
</div>
<script src="portal.js" defer></script>
</body>
</html>
