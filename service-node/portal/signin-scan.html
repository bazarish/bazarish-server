    <div data-signin-tabs hidden>
      <div class="tabs">
        <button class="tab is-on" type="button" data-signin-show="copy">{{t.signin.tabCopy}}</button>
        <button class="tab" type="button" data-signin-show="scan">{{t.signin.tabScan}}</button>
      </div>
    </div>
    <div data-signin-pane="scan" hidden>
      <div class="signin-code" data-sign-wait="/login/wait?nonce={{nonce}}">
        <div class="qr-code">{{qr}}</div>
        <p class="panel-note">{{t.signin.scan}}</p>
        <p class="notice is-error" data-sign-expired hidden>{{t.signin.expired}}</p>
      </div>
    </div>
