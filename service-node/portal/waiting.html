  <section class="panel">
    <h2 class="panel-title">{{t.waiting.title}}</h2>
    <p class="panel-note">{{t.waiting.note}}</p>
    {{message}}
    <ul class="facts">
      <li><span>{{t.facts.mailbox}}</span>{{mailbox}}</li>
      <li><span>{{t.facts.devices}}</span>{{devices}}</li>
    </ul>
    <p class="field-label">{{t.descriptor.label}}</p>
    <pre class="copy">{{descriptor}}</pre>
    <p class="panel-note">{{t.descriptor.paste}}</p>
  </section>
  <section class="panel">
    <h2 class="panel-title">{{t.delete.title}}</h2>
    <p class="panel-note">{{t.delete.note}}</p>
    <form method="post" action="/delete">
      <button class="btn btn-danger" type="submit">{{t.delete.mine}}</button>
    </form>
  </section>
