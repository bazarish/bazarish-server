<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title data-t="Set up - bazarish admin">Set up - bazarish admin</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="centred">
<main class="sheet">
  <div class="lang-slot" id="languageSlot"></div>
  <img class="wordmark" src="logo.svg" alt="bazarish" width="404" height="76">
  <p class="sheet-note" data-t="Admin - setup">Admin - setup</p>
  {{error}}
  <p class="panel-note" data-t="This panel has no administrator. The key that signs this challenge becomes one.">This panel has no administrator. The key that signs this challenge becomes one.</p>
  <p class="panel-note is-warning" data-t="Until then anyone who reaches this page can claim the panel">Until then anyone who reaches this page can claim the panel</p>
  <p class="panel-note" data-t="Sign this challenge with your account's key in Bazarish and paste the signature back">Sign this challenge with your account's key in Bazarish and paste the signature back</p>
  <p class="field-label" data-t="Challenge">Challenge</p>
  <pre class="copy">{{challenge}}</pre>
  <form method="post" action="/setup">
    <input type="hidden" name="challenge" value="{{challenge}}">
    <label class="field-label" for="blob" data-t="Signature">Signature</label>
    <textarea class="field" id="blob" name="blob" required autofocus></textarea>
    <button class="btn" type="submit" data-t="Claim this panel">Claim this panel</button>
  </form>
</main>
<script src="messages.js" defer></script>
<script src="i18n.js" defer></script>
<script src="copy.js" defer></script>
<script src="signin.js" defer></script>
</body>
</html>
