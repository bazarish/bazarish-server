<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>bazarish admin</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <nav class="sidebar">
    <div class="brand"><img class="wordmark" src="logo.svg" alt="bazarish" width="404" height="76"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M8.5 2.5l5.5 3.6 5.5-3.6"/><path d="M11.6 6h4.8l-1.1 3.2h-2.6z"/><path d="M12.7 9.2l-2.5 12.4 3.8 4 3.8-4-2.5-12.4"/><path d="M11.5 15.6l4.7-2.5M10.9 19.4l5.9-3.1"/></svg></div>
    <p class="sidebar-note sidebar-tag">admin {{version}}</p>
    <ul class="nav" id="nav">
      <li><a href="#/monitoring" data-view="monitoring" data-t="Monitoring">Monitoring</a></li>
      <li><a href="#/users" data-view="users" data-t="Users">Users</a></li>
      <li><a href="#/settings" data-view="settings" data-t="Settings">Settings</a></li>
    </ul>
    <form class="sidebar-foot" method="post" action="/logout">
      <button class="btn btn-quiet" type="submit" data-t="Sign out">Sign out</button>
    </form>
  </nav>
  <div class="corner" id="languageSlot"></div>
  <main class="content" id="content"></main>
</div>
<script src="messages.js" defer></script>
<script src="i18n.js" defer></script>
<script src="copy.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
