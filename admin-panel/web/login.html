<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title data-t="Sign in - bazarish admin">Sign in - bazarish admin</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="centred">
<div class="sheet">
  <div class="sheet-head">
    <div class="brand"><img class="wordmark" src="logo.svg" alt="bazarish" width="404" height="76"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M8.5 2.5l5.5 3.6 5.5-3.6"/><path d="M11.6 6h4.8l-1.1 3.2h-2.6z"/><path d="M12.7 9.2l-2.5 12.4 3.8 4 3.8-4-2.5-12.4"/><path d="M11.5 15.6l4.7-2.5M10.9 19.4l5.9-3.1"/></svg></div>
    <div id="languageSlot"></div>
  </div>
  <p class="sheet-note" data-t="Admin">Admin</p>
  <main class="sheet-body">
    <section class="panel-box">
      <p class="view-title" data-t="Sign in">Sign in</p>
      {{error}}
      <p class="panel-note" data-t="Sign this challenge with your account's key in Bazarish and paste the signature back">Sign this challenge with your account's key in Bazarish and paste the signature back</p>
      <p class="field-label" data-t="Challenge">Challenge</p>
      <pre class="copy">{{challenge}}</pre>
      <form method="post" action="/login">
        <input type="hidden" name="challenge" value="{{challenge}}">
        <label class="field-label" for="blob" data-t="Signature">Signature</label>
        <textarea class="field" id="blob" name="blob" required autofocus></textarea>
        <button class="btn" type="submit" data-t="Sign in">Sign in</button>
      </form>
    </section>
  </main>
  <footer class="colophon"><span data-t="Control panel of a Bazarish messenger server">Control panel of a Bazarish messenger server</span>
    <span><a href="https://bazarish.org">bazarish.org</a> &middot; <a href="http://bazarish.i2p">bazarish.i2p</a></span></footer>
</div>
<script src="messages.js" defer></script>
<script src="i18n.js" defer></script>
<script src="copy.js" defer></script>
<script src="signin.js" defer></script>
</body>
</html>
