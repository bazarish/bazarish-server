<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Set up - bazarish admin</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="centred">
<main class="sheet">
  <img class="wordmark" src="logo.svg" alt="bazarish" width="404" height="76">
  <p class="sheet-note">Admin - setup</p>
  {{error}}
  <p class="panel-note">This panel has no administrator. The key that signs this challenge
    becomes one.</p>
  <p class="panel-note is-warning">Until then anyone who reaches this page can claim the panel.</p>
  <p class="panel-note">Sign this challenge in Bazarish under Signature and paste the result
    back.</p>
  <p class="field-label">Challenge</p>
  <pre class="copy">{{challenge}}</pre>
  <form method="post" action="/setup">
    <input type="hidden" name="challenge" value="{{challenge}}">
    <label class="field-label" for="blob">Signature</label>
    <textarea class="field" id="blob" name="blob" required autofocus></textarea>
    <button class="btn" type="submit">Claim this panel</button>
  </form>
</main>
<script src="copy.js" defer></script>
<script src="signin.js" defer></script>
</body>
</html>
