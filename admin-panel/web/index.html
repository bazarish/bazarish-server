<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>bazarish admin</title>
<link rel="icon" href="favicon.svg">

</head>
<body>

<script src="copy.js" defer></script>
