  <section class="panel">
    <h2 class="panel-title">delete this account</h2>
    <p class="notice is-error">This cannot be undone. The mailbox and everything in it is dropped,
      and the address stops being served.</p>
    <ul class="facts">
      <li><span>Mailbox</span>{{mailbox}}</li>
      <li><span>Devices</span>{{devices}}</li>
    </ul>
    <div class="form-actions">
      <form class="inline" method="post" action="/delete">
        <input type="hidden" name="confirm" value="yes">
        <button class="btn btn-danger" type="submit">Delete it</button>
      </form>
      <a class="btn btn-quiet" href="/">Keep the account</a>
    </div>
  </section>
